
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Age Calculator - Years, Months, Days | S.K. Jha Tools</title>
    <meta name="description" content="Calculate your exact age in years, months, and days based on your birth date. Free online age calculator.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --slate-50: #f8fafc; --slate-900: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--slate-50); color: var(--slate-900); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .tool-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; padding: 2.5rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .ad-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 1rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; font-weight: bold; margin: 2rem 0; height: 100px; }
        footer { background: var(--slate-900); color: #94a3b8; padding: 4rem 0; margin-top: 5rem; }
    </style>
</head>
<body>
    <header class="glass-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="text-decoration-none d-flex align-items-center">
                <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fas fa-birthday-cake"></i></div>
                <div><h1 class="h5 mb-0 fw-bold text-dark">S.K. Jha <span class="text-primary">Tools</span></h1></div>
            </a>
            <a href="/" class="btn btn-dark rounded-pill px-4 fw-bold">Home</a>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-5 text-center">
                    <h2 class="display-4 fw-bold mb-3">Age Calculator</h2>
                    <p class="text-muted fs-5">Enter your date of birth to find your exact age.</p>
                </div>
                <div class="tool-card">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Date of Birth</label>
                        <input type="date" id="dob" class="form-control form-control-lg rounded-4 border-2">
                    </div>
                    <div class="p-4 bg-light rounded-4 text-center d-none" id="result-area">
                        <div class="row">
                            <div class="col-4 border-end">
                                <div id="res-y" class="h1 fw-black text-primary mb-0">0</div>
                                <div class="small fw-bold text-muted text-uppercase">Years</div>
                            </div>
                            <div class="col-4 border-end">
                                <div id="res-m" class="h1 fw-black text-primary mb-0">0</div>
                                <div class="small fw-bold text-muted text-uppercase">Months</div>
                            </div>
                            <div class="col-4">
                                <div id="res-d" class="h1 fw-black text-primary mb-0">0</div>
                                <div class="small fw-bold text-muted text-uppercase">Days</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="ad-box">Footer Advertisement</div>
            </div>
        </div>
    </main>
    <footer><div class="container text-center"><p>© 2024 S.K. Jha Tools.</p></div></footer>
    <script>
        document.getElementById('dob').addEventListener('change', function() {
            const birthDate = new Date(this.value);
            const today = new Date();
            if (isNaN(birthDate)) return;
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }
            document.getElementById('res-y').innerText = years;
            document.getElementById('res-m').innerText = months;
            document.getElementById('res-d').innerText = days;
            document.getElementById('result-area').classList.remove('d-none');
        });
    </script>
</body>
</html>
