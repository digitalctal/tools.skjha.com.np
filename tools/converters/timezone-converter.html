
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Time Zone Converter - Kathmandu, NYC, London | S.K. Jha Tools</title>
    <meta name="description" content="Compare and convert time across major global time zones including Nepal Standard Time (NPT).">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --slate-50: #f8fafc; --slate-900: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--slate-50); color: var(--slate-900); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .tool-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; padding: 2.5rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .ad-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 1rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; font-weight: bold; margin: 2rem 0; height: 100px; }
        footer { background: var(--slate-900); color: #94a3b8; padding: 4rem 0; margin-top: 5rem; }
    </style>
</head>
<body>
    <header class="glass-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="text-decoration-none d-flex align-items-center">
                <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fas fa-clock"></i></div>
                <div><h1 class="h5 mb-0 fw-bold text-dark">S.K. Jha <span class="text-primary">Tools</span></h1></div>
            </a>
            <a href="/" class="btn btn-dark rounded-pill px-4 fw-bold">Home</a>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="mb-5 text-center text-md-start">
                    <h2 class="display-4 fw-bold mb-3">Time Zone Converter</h2>
                    <p class="text-muted fs-5">Compare current time across global regions.</p>
                </div>
                <div class="ad-box">Header Advertisement</div>
                <div class="tool-card">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Select Local Time</label>
                            <input type="time" id="inputTime" class="form-control form-control-lg rounded-4 border-2">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Local Offset</label>
                            <select id="localOffset" class="form-select form-select-lg rounded-4 border-2">
                                <option value="5.75">Kathmandu (GMT+5:45)</option>
                                <option value="0">GMT/UTC</option>
                                <option value="-5">New York (GMT-5)</option>
                                <option value="1">London (GMT+1)</option>
                                <option value="8">Singapore (GMT+8)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-4 text-center" id="results"></div>
                </div>
            </div>
        </div>
    </main>
    <footer><div class="container text-center"><p>© 2024 S.K. Jha Tools. Nepal Standard Time focus.</p></div></footer>
    <script>
        const zones = {
            'Kathmandu': 5.75, 'UTC/GMT': 0, 'New York': -5, 'London': 1, 'Singapore': 8, 'Dubai': 4, 'Tokyo': 9
        };
        function update() {
            const timeVal = document.getElementById('inputTime').value || "12:00";
            const localOff = parseFloat(document.getElementById('localOffset').value);
            const [h, m] = timeVal.split(':').map(Number);
            const baseMinutes = h * 60 + m - (localOff * 60);
            let html = '';
            for (let name in zones) {
                const targetMinutes = baseMinutes + (zones[name] * 60);
                const finalDate = new Date();
                finalDate.setHours(0, targetMinutes, 0, 0);
                const timeStr = finalDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                html += `<div class="col-md-4 mb-3"><div class="p-3 bg-light rounded-4 border"><small class="text-muted text-uppercase fw-bold">${name}</small><div class="h4 mb-0 fw-bold">${timeStr}</div></div></div>`;
            }
            document.getElementById('results').innerHTML = html;
        }
        document.getElementById('inputTime').addEventListener('input', update);
        document.getElementById('localOffset').addEventListener('change', update);
        document.getElementById('inputTime').value = new Date().toTimeString().slice(0, 5);
        update();
    </script>
</body>
</html>
