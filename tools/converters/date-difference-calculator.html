
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator - Gap between Two Dates | S.K. Jha Tools</title>
    <meta name="description" content="Calculate the number of days, weeks, or months between any two selected dates. Free and accurate date gap calculator.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --slate-50: #f8fafc; --slate-900: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--slate-50); color: var(--slate-900); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .tool-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; padding: 2.5rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .ad-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 1rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; font-weight: bold; margin: 2rem 0; height: 100px; }
        footer { background: var(--slate-900); color: #94a3b8; padding: 4rem 0; margin-top: 5rem; }
    </style>
</head>
<body>
    <header class="glass-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="text-decoration-none d-flex align-items-center">
                <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fas fa-calendar-day"></i></div>
                <div><h1 class="h5 mb-0 fw-bold text-dark">S.K. Jha <span class="text-primary">Tools</span></h1></div>
            </a>
            <a href="/" class="btn btn-dark rounded-pill px-4 fw-bold">Home</a>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-5 text-center">
                    <h2 class="display-4 fw-bold mb-3">Date Difference</h2>
                    <p class="text-muted fs-5">Calculate the precise duration between any two dates.</p>
                </div>
                <div class="tool-card">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Start Date</label>
                            <input type="date" id="date1" class="form-control form-control-lg rounded-4 border-2">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">End Date</label>
                            <input type="date" id="date2" class="form-control form-control-lg rounded-4 border-2">
                        </div>
                    </div>
                    <div class="p-4 bg-light rounded-4 text-center d-none" id="result-area">
                        <div class="h2 fw-black text-primary mb-1"><span id="total-days">0</span> Days</div>
                        <div class="small fw-bold text-muted text-uppercase tracking-widest">Total Difference</div>
                        <div class="mt-3 text-muted small" id="detailed-diff"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer><div class="container text-center"><p>© 2024 S.K. Jha Tools. Precision Time Utils.</p></div></footer>
    <script>
        function calc() {
            const d1 = new Date(document.getElementById('date1').value);
            const d2 = new Date(document.getElementById('date2').value);
            if (isNaN(d1) || isNaN(d2)) return;
            const diffTime = Math.abs(d2 - d1);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('total-days').innerText = diffDays;
            const weeks = Math.floor(diffDays / 7);
            const remDays = diffDays % 7;
            document.getElementById('detailed-diff').innerText = `${weeks} weeks and ${remDays} days`;
            document.getElementById('result-area').classList.remove('d-none');
        }
        document.getElementById('date1').addEventListener('change', calc);
        document.getElementById('date2').addEventListener('change', calc);
    </script>
</body>
</html>
