
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Weight Converter - KG, LBS, Grams, Ounces | S.K. Jha Tools</title>
    <meta name="description" content="Convert weight and mass units including kilograms, pounds, grams, milligrams, and ounces. Fast, free online weight converter.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --slate-50: #f8fafc; --slate-900: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--slate-50); color: var(--slate-900); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .tool-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; padding: 2.5rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .ad-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 1rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; font-weight: bold; margin: 2rem 0; height: 100px; }
        footer { background: var(--slate-900); color: #94a3b8; padding: 4rem 0; margin-top: 5rem; }
    </style>
</head>
<body>
    <header class="glass-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="text-decoration-none d-flex align-items-center">
                <div class="bg-primary text-white p-2 rounded-3 me-2"><i class="fas fa-weight-hanging"></i></div>
                <div><h1 class="h5 mb-0 fw-bold text-dark">S.K. Jha <span class="text-primary">Tools</span></h1></div>
            </a>
            <a href="/" class="btn btn-dark rounded-pill px-4 fw-bold">Home</a>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="mb-5 text-center text-md-start">
                    <h2 class="display-4 fw-bold mb-3">Weight Converter</h2>
                    <p class="text-muted fs-5">Fast and accurate conversion between common units of mass.</p>
                </div>
                <div class="ad-box">Header Advertisement</div>
                <div class="tool-card">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">From Value</label>
                            <input type="number" id="inputVal" class="form-control form-control-lg rounded-4 border-2" value="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">From Unit</label>
                            <select id="fromUnit" class="form-select form-select-lg rounded-4 border-2">
                                <option value="kg">Kilogram (kg)</option>
                                <option value="g">Gram (g)</option>
                                <option value="mg">Milligram (mg)</option>
                                <option value="lb">Pound (lb)</option>
                                <option value="oz">Ounce (oz)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-4 text-center" id="results"></div>
                    <div class="ad-box mt-5">In-Content Ad</div>
                </div>
            </div>
        </div>
    </main>
    <footer><div class="container text-center"><p>© 2024 S.K. Jha Tools. Built with care in Nepal 🇳🇵</p></div></footer>
    <script>
        const units = { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.0283495 };
        const labels = { kg:'Kilograms', g:'Grams', mg:'Milligrams', lb:'Pounds', oz:'Ounces' };
        function convert() {
            const val = parseFloat(document.getElementById('inputVal').value) || 0;
            const from = document.getElementById('fromUnit').value;
            const baseKG = val * units[from];
            let html = '';
            for (let unit in units) {
                if (unit === from) continue;
                const result = baseKG / units[unit];
                html += `<div class="col-md-4 mb-3"><div class="p-3 bg-light rounded-4 border"><small class="text-muted text-uppercase fw-bold">${labels[unit]}</small><div class="h4 mb-0 fw-bold">${result.toLocaleString(undefined, {maximumFractionDigits: 6})}</div></div></div>`;
            }
            document.getElementById('results').innerHTML = html;
        }
        document.getElementById('inputVal').addEventListener('input', convert);
        document.getElementById('fromUnit').addEventListener('change', convert);
        convert();
    </script>
</body>
</html>
